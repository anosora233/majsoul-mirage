name: Update resources and latest release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resources-release.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
  schedule:
    # 17:17 in Asia/Shanghai and Asia/Singapore (UTC+8).
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when resources and source are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: resources-latest-release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      update: ${{ steps.resources.outputs.update }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: resources
        env:
          FORCE_BUILD: ${{ inputs.force || false }}
        run: node scripts/release-resources.cjs check

  build:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run resources:prepare
      - run: npm test
      - run: npm run test:lua
      - run: node --check majsoul-mirage.user.js
      - run: node scripts/release-resources.cjs manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            majsoul-mirage.user.js
            .cache/release/resource-version.json
            .cache/release/notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Do not execute downloaded resource code in the job with release credentials.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
      - name: Replace the single rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the previous release if any build or test above failed.
          if gh api "repos/$GH_REPO/git/ref/tags/latest" > tag.json 2> tag-error.txt; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$SOURCE_SHA" -F force=true
          elif grep -q 'HTTP 404' tag-error.txt; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$SOURCE_SHA"
          else
            cat tag-error.txt >&2
            exit 1
          fi
          if gh release view latest > /dev/null 2> release-error.txt; then
            gh release upload latest majsoul-mirage.user.js .cache/release/resource-version.json --clobber
            gh release edit latest --title 'Majsoul Mirage — Latest' --notes-file .cache/release/notes.md --latest
          elif grep -q 'release not found\|HTTP 404' release-error.txt; then
            gh release create latest majsoul-mirage.user.js .cache/release/resource-version.json \
              --verify-tag --title 'Majsoul Mirage — Latest' --notes-file .cache/release/notes.md --latest
          else
            cat release-error.txt >&2
            exit 1
          fi
